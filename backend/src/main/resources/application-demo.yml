spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:aichinese-demo;MODE=MYSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

server:
  address: 127.0.0.1

app:
  security:
    jwt:
      # Same pattern as the local profile: JWT_SECRET overrides the built-in demo key when it is set.
      secret: ${JWT_SECRET:DemoProfileJwtSecretForFypLocalRun1234567890AB}
  ai:
    enable-real-provider: false
  email:
    enabled: false
