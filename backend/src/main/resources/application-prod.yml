springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    # A production database must already be owned by Flyway history. Never
    # silently bless a non-empty, unversioned database as a valid baseline.
    baseline-on-migrate: false
    # Explicit production guard: schema erasure must never be possible in prod.
    clean-disabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  security:
    jwt:
      refresh-token-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
    forwarded:
      trusted-proxies: ${APP_SECURITY_FORWARDED_TRUSTED_PROXIES:}
  payment:
    mock-success-enabled: ${PAYMENT_MOCK_SUCCESS_ENABLED:false}
    # Production must use an explicit real provider. Startup now fails fast if
    # this resolves to no-op/mock, the Stripe key is missing, or the payment
    # return URLs still point at localhost/non-HTTPS targets.
    provider: ${PAYMENT_PROVIDER:stripe}

# Production log level overrides: suppress framework DEBUG/TRACE noise
# that bloats log aggregators and may expose internal stack traces.
logging:
  level:
    root: WARN
    com.example.aichinese: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
