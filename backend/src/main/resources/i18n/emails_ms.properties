# Bahasa Melayu texts of emails.properties (same keys, same values in braces).

passwordReset.subject=Permintaan tetapan semula kata laluan
passwordReset.body=Kami menerima permintaan untuk menetapkan semula kata laluan akaun anda.\n\
\n\
Klik pautan di bawah untuk menetapkan kata laluan baharu (pautan tamat tempoh dalam 60 minit):\n\
{link}\n\
\n\
Jika anda tidak meminta tetapan semula kata laluan, anda boleh abaikan e-mel ini.

emailChange.subject=Sahkan alamat e-mel baharu anda
emailChange.body=Buka pautan ini untuk menggunakan alamat ini bagi akaun MandarinSpark anda (pautan berfungsi sekali, selama 60 minit):\n\
{link}\n\
\n\
Jika anda tidak meminta untuk menukar alamat e-mel anda, anda boleh abaikan e-mel ini.

signupConfirmation.subject=Sahkan alamat e-mel anda
signupConfirmation.greeting=Hai {name}, selamat datang ke MandarinSpark!
signupConfirmation.greetingNoName=Hai, selamat datang ke MandarinSpark!
signupConfirmation.body={greeting}\n\
\n\
Buka pautan ini untuk mengesahkan alamat e-mel anda (pautan berfungsi sekali, selama 3 hari):\n\
{link}\n\
\n\
Anda boleh terus belajar sementara itu. Jika anda tidak mencipta akaun ini, anda boleh abaikan e-mel ini.

adminInvite.subject=Anda dijemput menjadi pentadbir MandarinSpark
adminInvite.someAdmin=Seorang pentadbir
adminInvite.body={inviter} menjemput anda untuk membantu menguruskan MandarinSpark. Pentadbir mencipta kelas, mengurus pengguna dan menukar tetapan AI.\n\
\n\
Buka pautan ini untuk menetapkan kata laluan anda (pautan berfungsi selama 7 hari):\n\
{link}

supportReply.subject=Re: #{number} {subject}
supportReply.body={reply}\n\
\n\
Sokongan MandarinSpark. Balas e-mel ini atau hantar mesej kepada kami di halaman Bantuan.

reviewQueueDigest.subject=Ringkasan harian MandarinSpark anda
reviewQueueDigest.intro=Menunggu pentadbir di MandarinSpark:
reviewQueueDigest.queue={queue}: {count}
reviewQueueDigest.aiReports=Laporan AI
reviewQueueDigest.supportRequests=Permintaan sokongan
reviewQueueDigest.switchOffNote=Anda menerima e-mel ini kerana Ringkasan harian dihidupkan dalam Akaun > Pemberitahuan e-mel. Matikannya di sana untuk berhenti menerima e-mel ini.
