# Simplified Chinese texts of emails.properties (same keys, same values in braces).

passwordReset.subject=密码重置请求
passwordReset.body=我们收到了重置你账号密码的请求。\n\
\n\
点击下面的链接设置新密码（链接 60 分钟后失效）：\n\
{link}\n\
\n\
如果你没有申请重置密码，可以放心忽略这封邮件。

emailChange.subject=确认你的新邮箱地址
emailChange.body=打开此链接，即可将此地址用于你的 MandarinSpark 账号（链接只能使用一次，有效期 60 分钟）：\n\
{link}\n\
\n\
如果你没有申请更改邮箱地址，可以忽略这封邮件。

signupConfirmation.subject=确认你的邮箱地址
signupConfirmation.greeting={name}，你好，欢迎来到 MandarinSpark！
signupConfirmation.greetingNoName=你好，欢迎来到 MandarinSpark！
signupConfirmation.body={greeting}\n\
\n\
打开此链接确认你的邮箱地址（链接只能使用一次，有效期 3 天）：\n\
{link}\n\
\n\
在此期间你可以继续学习。如果你没有创建这个账号，可以忽略这封邮件。

adminInvite.subject=你受邀成为 MandarinSpark 管理员
adminInvite.someAdmin=一位管理员
adminInvite.body={inviter} 邀请你协助管理 MandarinSpark。管理员负责制作课堂、管理用户和更改 AI 设置。\n\
\n\
打开此链接设置你的密码（链接 7 天内有效）：\n\
{link}

supportReply.subject=Re: #{number} {subject}
supportReply.body={reply}\n\
\n\
MandarinSpark 客服。直接回复这封邮件，或在帮助页面给我们留言。

reviewQueueDigest.subject=你的 MandarinSpark 每日汇总
reviewQueueDigest.intro=MandarinSpark 上等待管理员处理的事项：
reviewQueueDigest.queue={queue}：{count}
reviewQueueDigest.aiReports=AI 举报
reviewQueueDigest.supportRequests=支持请求
reviewQueueDigest.switchOffNote=你收到这封邮件，是因为你在“账号 > 邮件通知”中开启了“每日汇总”。在那里关闭即可不再收到这类邮件。
