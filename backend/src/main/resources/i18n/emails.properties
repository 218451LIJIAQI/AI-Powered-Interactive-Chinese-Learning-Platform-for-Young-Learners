# The fixed words of every e-mail (TransactionalEmailDispatcher, through EmailTexts), in English. This file is also
# the fallback of emails_ms.properties and emails_zh_CN.properties, which hold the same keys with the same values in
# braces. A value in braces ({link}) is put in exactly as given; \n is a line break. The wording follows the
# frontend bundles (frontend/src/plugins/*Messages.ts).

# Forgot password (AuthService)
passwordReset.subject=Password reset request
passwordReset.body=We received a request to reset the password for your account.\n\
\n\
Click the link below to set a new password (link expires in 60 minutes):\n\
{link}\n\
\n\
If you did not request a password reset, you can safely ignore this email.

# A new e-mail address (AccountEmailService), sent to that address
emailChange.subject=Confirm your new email address
emailChange.body=Open this link to use this address for your MandarinSpark account (the link works once, for 60 minutes):\n\
{link}\n\
\n\
If you did not ask to change your email address, you can ignore this email.

# A new student's address (EmailConfirmationService); {greeting} is one of the two greetings
signupConfirmation.subject=Confirm your email address
signupConfirmation.greeting=Hi {name}, welcome to MandarinSpark!
signupConfirmation.greetingNoName=Hi there, welcome to MandarinSpark!
signupConfirmation.body={greeting}\n\
\n\
Open this link to confirm your email address (the link works once, for 3 days):\n\
{link}\n\
\n\
You can keep learning in the meantime. If you did not create this account, you can ignore this email.

# Admin invite (AdminInviteService); {inviter} is the inviting admin's name, or someAdmin
adminInvite.subject=You are invited to be a MandarinSpark admin
adminInvite.someAdmin=An admin
adminInvite.body={inviter} invited you to help run MandarinSpark. Admins create classes, manage users and change AI settings.\n\
\n\
Open this link to set your password (the link works for 7 days):\n\
{link}

# Support's answer to a request (SupportService), e-mailed to the learner or the Help page visitor who sent it; {reply}
# is the answer as support wrote it
supportReply.subject=Re: #{number} {subject}
supportReply.body={reply}\n\
\n\
MandarinSpark support. Reply to this email or send us a message on the Help page.

# The admins' daily summary e-mail (ReviewQueueDigestService)
reviewQueueDigest.subject=Your MandarinSpark daily summary
reviewQueueDigest.intro=Waiting for an admin on MandarinSpark:
reviewQueueDigest.queue={queue}: {count}
reviewQueueDigest.aiReports=AI reports
reviewQueueDigest.supportRequests=Support requests
reviewQueueDigest.switchOffNote=You get this email because Daily summary is switched on in Account > Email notifications. Switch it off there to stop these emails.
