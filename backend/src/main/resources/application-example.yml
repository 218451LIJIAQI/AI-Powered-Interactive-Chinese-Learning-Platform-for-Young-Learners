spring:
  application:
    name: ai-chinese-learning-platform-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ai_chinese_learning}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Singapore
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: ${MAX_VIDEO_FILE_SIZE:100MB}
      max-request-size: ${MAX_VIDEO_FILE_SIZE:100MB}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      # Use a strong plain-text secret with at least 32 characters/bytes.
      # If you want to provide a Base64-encoded secret, prefix it with 'base64:'.
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION}
  upload:
    directory: ${UPLOAD_DIR:./uploads}
    max-file-size: ${MAX_FILE_SIZE:5MB}
    recorded-video-directory: ${RECORDED_VIDEO_UPLOAD_DIR:./uploads/recorded-videos}
    max-video-file-size: ${MAX_VIDEO_FILE_SIZE:100MB}
  ai:
    provider: ${AI_PROVIDER:deepseek}
    api-base-url: ${AI_API_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:replace-with-your-deepseek-api-key}
    model-name: ${AI_MODEL_NAME:deepseek-chat}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1200}
    enable-real-provider: ${AI_ENABLE_REAL_PROVIDER:false}
  payment:
    provider: ${PAYMENT_PROVIDER:stripe}
    stripe-secret-key: ${STRIPE_SECRET_KEY:replace-with-your-stripe-test-secret-key}
    stripe-public-key: ${STRIPE_PUBLIC_KEY:replace-with-your-stripe-test-public-key}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:replace-with-your-stripe-webhook-secret}
    success-url: ${PAYMENT_SUCCESS_URL:http://localhost:5173/payment/success}
    cancel-url: ${PAYMENT_CANCEL_URL:http://localhost:5173/payment/cancel}
    currency: ${PAYMENT_CURRENCY:MYR}
    timeout-seconds: ${PAYMENT_TIMEOUT_SECONDS:30}
    enable-real-provider: ${PAYMENT_ENABLE_REAL_PROVIDER:false}
    mock-success-enabled: ${PAYMENT_MOCK_SUCCESS_ENABLED:true}
  email:
    enabled: ${SMTP_ENABLED:false}
    from: ${SMTP_FROM:}

  # SMTP is optional. If SMTP_ENABLED=false or SMTP_HOST is empty,
  # the backend still starts and falls back to in-app notifications only.
