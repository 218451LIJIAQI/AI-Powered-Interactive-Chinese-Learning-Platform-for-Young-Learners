spring:
  application:
    name: ai-chinese-learning-platform-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ai_chinese_learning}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Singapore&connectionTimeZone=Asia/Singapore&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 60000
      maximum-pool-size: ${DB_MAX_POOL_SIZE:30}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_VIDEO_FILE_SIZE:100MB}
      max-request-size: ${MAX_VIDEO_FILE_SIZE:100MB}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH_ENABLED:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLED:true}
            required: ${SMTP_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${SMTP_SSL_ENABLED:false}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${SERVER_PORT:8080}

app:
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176,http://localhost:5177,http://127.0.0.1:5177,http://localhost:5178,http://127.0.0.1:5178,http://localhost:5179,http://127.0.0.1:5179,http://localhost:5180,http://127.0.0.1:5180,http://localhost:5181,http://127.0.0.1:5181,http://localhost:5182,http://127.0.0.1:5182,http://localhost:5183,http://127.0.0.1:5183}
  security:
    login-rate-limit:
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
      attempt-window-minutes: ${LOGIN_ATTEMPT_WINDOW_MINUTES:15}
      lock-duration-minutes: ${LOGIN_LOCK_DURATION_MINUTES:15}
      max-tracked-records: ${LOGIN_MAX_TRACKED_RECORDS:10000}
    public-auth-rate-limit:
      register-requests: ${REGISTER_REQUESTS_PER_WINDOW:100}
      forgot-password-requests: ${FORGOT_PASSWORD_REQUESTS_PER_WINDOW:10}
      window-minutes: ${PUBLIC_AUTH_WINDOW_MINUTES:15}
      max-tracked-records: ${PUBLIC_AUTH_MAX_TRACKED_RECORDS:10000}
    jwt:
      # Use a strong plain-text secret with at least 32 characters/bytes.
      # If you want to provide a Base64-encoded secret, prefix it with 'base64:'.
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION}
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
      refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:mandarin_spark_refresh}
      refresh-token-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
      refresh-token-same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Strict}
    forwarded:
      # Optional comma-separated proxy IPs/CIDRs that may supply
      # X-Forwarded-For on auth endpoints in front of this backend.
      trusted-proxies: ${APP_SECURITY_FORWARDED_TRUSTED_PROXIES:}
  upload:
    directory: ${UPLOAD_DIR:./uploads}
    max-file-size: ${MAX_FILE_SIZE:10MB}
    verification-document-max-file-size: ${MAX_VERIFICATION_DOCUMENT_FILE_SIZE:5MB}
    ai-audio-max-file-size: ${MAX_AI_AUDIO_FILE_SIZE:10MB}
    ai-image-max-file-size: ${MAX_AI_IMAGE_FILE_SIZE:10MB}
    recorded-video-directory: ${RECORDED_VIDEO_UPLOAD_DIR:./uploads/recorded-videos}
    max-video-file-size: ${MAX_VIDEO_FILE_SIZE:100MB}
  ai:
    provider: ${AI_PROVIDER:deepseek}
    api-base-url: ${AI_API_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:replace-with-your-deepseek-api-key}
    model-name: ${AI_MODEL_NAME:deepseek-chat}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1200}
    enable-real-provider: ${AI_ENABLE_REAL_PROVIDER:false}
    rate-limit:
      requests-per-minute: ${AI_REQUESTS_PER_MINUTE:10}
      requests-per-day: ${AI_REQUESTS_PER_DAY:100}
  payment:
    success-url: ${PAYMENT_SUCCESS_URL:${FRONTEND_BASE_URL:http://localhost:5174}/payment/success}
    cancel-url: ${PAYMENT_CANCEL_URL:${FRONTEND_BASE_URL:http://localhost:5174}/payment/cancel}
    mock-success-enabled: ${PAYMENT_MOCK_SUCCESS_ENABLED:false}
    # Dev-safe default. The prod profile refuses to start unless this resolves
    # to stripe with a real STRIPE_API_KEY and public HTTPS URLs.
    provider: ${PAYMENT_PROVIDER:no-op}
    stripe-api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com}
    stripe-api-key: ${STRIPE_API_KEY:replace-with-your-stripe-secret-key}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:replace-with-your-stripe-webhook-signing-secret}
  email:
    enabled: ${SMTP_ENABLED:false}
    from: ${SMTP_FROM:}
    password-reset-base-url: ${PASSWORD_RESET_BASE_URL:${FRONTEND_BASE_URL:http://localhost:5174}/reset-password}

  # SMTP is optional outside production. Production startup requires
  # SMTP_ENABLED=true so password-reset links can be delivered. When enabled,
  # SMTP_HOST is required and SMTP_USERNAME/SMTP_PASSWORD are required
  # unless SMTP_AUTH_ENABLED=false. Use SMTP_STARTTLS_ENABLED=true for
  # port 587 TLS, or SMTP_SSL_ENABLED=true and SMTP_STARTTLS_ENABLED=false
  # for port 465 SSL.
