spring:
  application:
    name: ai-chinese-learning-platform-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ai_chinese_learning}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Singapore
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_FILE_SIZE:5MB}

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      # Use a strong plain-text secret with at least 32 characters/bytes.
      # If you want to provide a Base64-encoded secret, prefix it with 'base64:'.
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION}
  upload:
    directory: ${UPLOAD_DIR:./uploads}
    max-file-size: ${MAX_FILE_SIZE:5MB}
