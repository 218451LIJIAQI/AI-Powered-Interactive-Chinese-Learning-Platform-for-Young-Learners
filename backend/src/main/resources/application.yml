spring:
  application:
    name: ai-chinese-learning-platform-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ai_chinese_learning}?sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&connectionTimeZone=${APP_DEFAULT_TIME_ZONE:Asia/Singapore}&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      initialization-fail-timeout: 60000
      maximum-pool-size: ${DB_MAX_POOL_SIZE:30}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  servlet:
    multipart:
      resolve-lazily: true
      # Each feature enforces its own file limit. Leave room for form fields and multipart boundaries.
      max-file-size: ${MAX_REQUEST_SIZE:201MB}
      max-request-size: ${MAX_REQUEST_SIZE:201MB}
  mail:
    protocol: ${SMTP_PROTOCOL:smtp}
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            checkserveridentity: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        smtps:
          auth: true
          ssl:
            checkserveridentity: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# SpringDoc OpenAPI at its default paths: the Swagger UI lives at
# /swagger-ui.html and reads the JSON description from /v3/api-docs.
springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    # Keep resource resolution aligned with the patched WebJar in pom.xml.
    version: '@swagger-ui.version@'
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

app:
  bootstrap-admin:
    email: ${DEFAULT_ADMIN_EMAIL:}
    password: ${DEFAULT_ADMIN_PASSWORD:}
  platform:
    default-time-zone: ${APP_DEFAULT_TIME_ZONE:Asia/Singapore}
  scheduling:
    # Background jobs on the platform day: the admins' daily summary e-mail from 8:00, the learners' daily-goal
    # reminder from 19:00 and the weekly mistakes reminder from Monday 10:00.
    enabled: ${APP_SCHEDULING_ENABLED:true}
  security:
    public-auth-rate-limit:
      register-requests: ${REGISTER_REQUESTS_PER_WINDOW:100}
      forgot-password-requests: ${FORGOT_PASSWORD_REQUESTS_PER_WINDOW:10}
    jwt:
      # JWT_SECRET must be supplied via environment variable; the default is empty so the
      # SecurityProperties constructor rejects it at startup if it is not set.
      secret: ${JWT_SECRET:}
      # Access tokens are deliberately short-lived; browser continuity is
      # handled by rotating HttpOnly refresh-token cookies.
      expiration: ${JWT_EXPIRATION:900000}
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
      refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:mandarin_spark_refresh}
      refresh-token-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
      refresh-token-same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Strict}
    forwarded:
      # Comma-separated proxy IPs/CIDRs whose X-Forwarded-For names the client address that the per-IP rate
      # limits use (ClientIpResolver). Loopback addresses are always trusted.
      trusted-proxies: ${APP_SECURITY_FORWARDED_TRUSTED_PROXIES:}
  cors:
    # Comma-separated exact origins of the web app, allowed to call the API with credentials (CorsConfig). Empty:
    # the Vite dev server outside production; the prod profile refuses to start without public https origins.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  upload:
    directory: ${UPLOAD_DIR:./uploads}
    support-screenshot-max-file-size: ${MAX_SUPPORT_SCREENSHOT_FILE_SIZE:5MB}
    ai-audio-max-file-size: ${MAX_AI_AUDIO_FILE_SIZE:10MB}
    ai-image-max-file-size: ${MAX_AI_IMAGE_FILE_SIZE:10MB}
    recorded-video-directory: ${RECORDED_VIDEO_UPLOAD_DIR:./uploads/recorded-videos}
    max-video-file-size: ${MAX_VIDEO_FILE_SIZE:200MB}
  ai:
    provider: ${AI_PROVIDER:openai}
    api-base-url: ${AI_API_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model-name: ${AI_MODEL_NAME:gpt-5.6-luna}
    pronunciation:
      secret-id: ${TENCENT_SOE_SECRET_ID:}
      secret-key: ${TENCENT_SOE_SECRET_KEY:}
      soe-app-id: ${TENCENT_SOE_APP_ID:}
      ffmpeg-path: ${AI_FFMPEG_PATH:ffmpeg}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1200}
    enable-real-provider: ${AI_ENABLE_REAL_PROVIDER:false}
    rate-limit:
      requests-per-minute: ${AI_REQUESTS_PER_MINUTE:10}
      requests-per-day: ${AI_REQUESTS_PER_DAY:100}
  email:
    enabled: ${SMTP_ENABLED:false}
    from: ${SMTP_FROM:}
    password-reset-base-url: ${PASSWORD_RESET_BASE_URL:${FRONTEND_BASE_URL:http://localhost:5174}/reset-password}

---
# Production overrides: require encrypted MySQL transport, refuse implicit Flyway baselines, and disable API docs.
spring:
  config:
    activate:
      on-profile: prod | production
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ai_chinese_learning}?sslMode=${DB_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=false&connectionTimeZone=${APP_DEFAULT_TIME_ZONE:Asia/Singapore}&useUnicode=true&characterEncoding=utf8
  flyway:
    baseline-on-migrate: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
