spring:
  application:
    name: ai-chinese-learning-platform-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ai_chinese_learning}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Singapore&useUnicode=true&characterEncoding=utf8
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      initialization-fail-timeout: 60000
      maximum-pool-size: ${DB_MAX_POOL_SIZE:30}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_VIDEO_FILE_SIZE:100MB}
      # The whole request also carries the form fields and multipart boundaries, so it must be a little larger
      # than the largest allowed file; otherwise a video exactly at the 100 MB limit (SRS FRCONT04) is refused.
      max-request-size: ${MAX_REQUEST_SIZE:101MB}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH_ENABLED:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLED:true}
            required: ${SMTP_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${SMTP_SSL_ENABLED:false}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${SERVER_PORT:8080}
  # Let Spring Boot finish in-flight requests when the local app is stopped.
  shutdown: graceful

# SpringDoc OpenAPI at its default paths: the Swagger UI lives at
# /swagger-ui.html and reads the JSON description from /v3/api-docs.
springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${APP_ENVIRONMENT:local}
  release: ${APP_RELEASE:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

app:
  platform:
    default-time-zone: ${APP_DEFAULT_TIME_ZONE:Asia/Singapore}
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}
  security:
    login-rate-limit:
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
      attempt-window-minutes: ${LOGIN_ATTEMPT_WINDOW_MINUTES:15}
      lock-duration-minutes: ${LOGIN_LOCK_DURATION_MINUTES:15}
      max-tracked-records: ${LOGIN_MAX_TRACKED_RECORDS:10000}
    public-auth-rate-limit:
      register-requests: ${REGISTER_REQUESTS_PER_WINDOW:100}
      forgot-password-requests: ${FORGOT_PASSWORD_REQUESTS_PER_WINDOW:10}
      window-minutes: ${PUBLIC_AUTH_WINDOW_MINUTES:15}
      max-tracked-records: ${PUBLIC_AUTH_MAX_TRACKED_RECORDS:10000}
    jwt:
      # JWT_SECRET must be supplied via environment variable; the default is empty so the
      # SecurityProperties constructor rejects it at startup if it is not set.
      secret: ${JWT_SECRET:}
      # Access tokens are deliberately short-lived; browser continuity is
      # handled by rotating HttpOnly refresh-token cookies.
      expiration: ${JWT_EXPIRATION:900000}
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
      refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:mandarin_spark_refresh}
      refresh-token-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
      refresh-token-same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Strict}
    forwarded:
      # Comma-separated proxy IPs/CIDRs that are allowed to supply
      # X-Forwarded-For on auth endpoints. Loopback addresses are trusted
      # automatically for local development and MockMvc tests.
      trusted-proxies: ${APP_SECURITY_FORWARDED_TRUSTED_PROXIES:}
  upload:
    directory: ${UPLOAD_DIR:./uploads}
    max-file-size: ${MAX_FILE_SIZE:10MB}
    verification-document-max-file-size: ${MAX_VERIFICATION_DOCUMENT_FILE_SIZE:5MB}
    ai-audio-max-file-size: ${MAX_AI_AUDIO_FILE_SIZE:10MB}
    ai-image-max-file-size: ${MAX_AI_IMAGE_FILE_SIZE:10MB}
    recorded-video-directory: ${RECORDED_VIDEO_UPLOAD_DIR:./uploads/recorded-videos}
    max-video-file-size: ${MAX_VIDEO_FILE_SIZE:100MB}
  ai:
    provider: ${AI_PROVIDER:openai}
    api-base-url: ${AI_API_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model-name: ${AI_MODEL_NAME:gpt-5.6-luna}
    transcription-model: ${AI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1200}
    enable-real-provider: ${AI_ENABLE_REAL_PROVIDER:false}
    rate-limit:
      requests-per-minute: ${AI_REQUESTS_PER_MINUTE:10}
      requests-per-day: ${AI_REQUESTS_PER_DAY:100}
  email:
    enabled: ${SMTP_ENABLED:false}
    from: ${SMTP_FROM:}
    password-reset-base-url: ${PASSWORD_RESET_BASE_URL:${FRONTEND_BASE_URL:http://localhost:5174}/reset-password}

---
# Swagger UI and the OpenAPI JSON are for local development and demonstrations only.
spring:
  config:
    activate:
      on-profile: prod | production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
