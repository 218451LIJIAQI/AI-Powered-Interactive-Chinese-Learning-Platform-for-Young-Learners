# Keep the real demo seeders, but run them on the tests' database and place their uploaded files in test output.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${TEST_DB_NAME:ai_chinese_learning_test}?createDatabaseIfNotExist=true&sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Singapore&useUnicode=true&characterEncoding=utf8

logging:
  level:
    root: warn

app:
  # The demo profile empties DEMO_DB_NAME before the rebuild: here it is the tests' database.
  schema-reset:
    database: ${TEST_DB_NAME:ai_chinese_learning_test}
  # Match connectionTimeZone above so developer shell APP_DEFAULT_TIME_ZONE cannot split JDBC and platform days.
  platform:
    default-time-zone: Asia/Singapore
  # No background jobs: a run would queue e-mails or notifications the seeder tests do not expect.
  # Also pinned via Maven Surefire systemPropertyVariables so shell APP_SCHEDULING_ENABLED cannot override this.
  scheduling:
    enabled: false
  security:
    forwarded:
      # Also pinned via Maven Surefire systemPropertyVariables so shell APP_SECURITY_FORWARDED_TRUSTED_PROXIES
      # cannot alter ClientIpResolver behavior in tests.
      trusted-proxies: ""
  # Test-only credentials overriding app.* so host DEFAULT_ADMIN_* / DEMO_STUDENT_PASSWORD env vars never leak into
  # demo seeder tests, letting all demo test classes share one deterministic cached ApplicationContext.
  bootstrap-admin:
    email: admin@demo-test.invalid
    password: DemoTestAdmin123!
  demo:
    student-password: DemoStudent123!
  upload:
    directory: ./target/test-demo-uploads
    recorded-video-directory: ./target/test-demo-uploads/recorded-videos
  ai:
    enable-real-provider: false
    api-key: ""
    api-key-file: ""
    pronunciation:
      secret-id: ""
      secret-key: ""
      soe-app-id: ""
  email:
    enabled: false
