spring:
  datasource:
    url: jdbc:h2:mem:aichinese-${random.uuid};MODE=MYSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Test profile intentionally uses Hibernate create-drop with isolated H2
      # databases for fast integration tests. Runtime profiles must use
      # Flyway-managed migrations plus ddl-auto=validate.
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    # MySQL migrations are validated in runtime profiles; H2 tests use
    # create-drop schema generation to keep each test context isolated.
    enabled: false
  sql:
    init:
      mode: never

logging:
  level:
    root: warn

app:
  security:
    jwt:
      secret: RuntimeStyleJwtSecretForTests1234567890AB
      # Keep test tokens long-lived so slow local verification or a paused
      # laptop cannot expire a token in the middle of one MockMvc test.
      expiration: 86400000
      refresh-token-expiration: 604800000
      refresh-token-cookie-name: mandarin_spark_refresh
      refresh-token-cookie-secure: false
      refresh-token-same-site: Strict
  upload:
    directory: ./target/test-uploads
    max-file-size: 1KB
    verification-document-max-file-size: 1KB
    ai-audio-max-file-size: 1KB
    ai-image-max-file-size: 1KB
    recorded-video-directory: ./target/test-recorded-videos
    max-video-file-size: 1KB
