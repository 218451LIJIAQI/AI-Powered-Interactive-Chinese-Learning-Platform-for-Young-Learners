services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-ai_chinese_learning}
      MYSQL_USER: ${DB_USERNAME:-aichinese_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      TZ: Asia/Singapore
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - application-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysqladmin ping -u"$${MYSQL_USER}" -h 127.0.0.1 --silent']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ai_chinese_learning}
      DB_USERNAME: ${DB_USERNAME:-aichinese_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-30}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      ASYNC_CORE_POOL_SIZE: ${ASYNC_CORE_POOL_SIZE:-2}
      ASYNC_MAX_POOL_SIZE: ${ASYNC_MAX_POOL_SIZE:-4}
      ASYNC_QUEUE_CAPACITY: ${ASYNC_QUEUE_CAPACITY:-100}
      APP_DEFAULT_TIME_ZONE: ${APP_DEFAULT_TIME_ZONE:-Asia/Singapore}
      APP_DEPLOYMENT_MODE: ${APP_DEPLOYMENT_MODE:-single-instance}
      APP_SHARED_AUTH_RATE_LIMITING_ENABLED: ${APP_SHARED_AUTH_RATE_LIMITING_ENABLED:-false}
      APP_LOCAL_STORAGE_MULTI_INSTANCE_ACKNOWLEDGED: ${APP_LOCAL_STORAGE_MULTI_INSTANCE_ACKNOWLEDGED:-false}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_ATTEMPT_WINDOW_MINUTES: ${LOGIN_ATTEMPT_WINDOW_MINUTES:-15}
      LOGIN_LOCK_DURATION_MINUTES: ${LOGIN_LOCK_DURATION_MINUTES:-15}
      LOGIN_MAX_TRACKED_RECORDS: ${LOGIN_MAX_TRACKED_RECORDS:-10000}
      REGISTER_REQUESTS_PER_WINDOW: ${REGISTER_REQUESTS_PER_WINDOW:-100}
      FORGOT_PASSWORD_REQUESTS_PER_WINDOW: ${FORGOT_PASSWORD_REQUESTS_PER_WINDOW:-10}
      PUBLIC_AUTH_WINDOW_MINUTES: ${PUBLIC_AUTH_WINDOW_MINUTES:-15}
      PUBLIC_AUTH_MAX_TRACKED_RECORDS: ${PUBLIC_AUTH_MAX_TRACKED_RECORDS:-10000}
      APP_SECURITY_FORWARDED_TRUSTED_PROXIES: ${APP_SECURITY_FORWARDED_TRUSTED_PROXIES:-172.28.0.10}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Set FRONTEND_BASE_URL to the public HTTPS frontend URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS to explicit HTTPS frontend origins}
      UPLOAD_DIR: /app/uploads
      RECORDED_VIDEO_UPLOAD_DIR: /app/uploads/recorded-videos
      AI_ENABLE_REAL_PROVIDER: ${AI_ENABLE_REAL_PROVIDER:-true}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:?Set AI_API_KEY for the production AI provider}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-deepseek-chat}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-10}
      AI_REQUESTS_PER_DAY: ${AI_REQUESTS_PER_DAY:-100}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stripe}
      STRIPE_API_KEY: ${STRIPE_API_KEY:?Set STRIPE_API_KEY to a live production key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:?Set PAYMENT_SUCCESS_URL to an HTTPS frontend callback}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:?Set PAYMENT_CANCEL_URL to an HTTPS frontend callback}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST for production password-reset email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_AUTH_ENABLED: ${SMTP_AUTH_ENABLED:-true}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-true}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED:-false}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-5000}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-5000}
      SMTP_WRITE_TIMEOUT_MS: ${SMTP_WRITE_TIMEOUT_MS:-5000}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:?Set PASSWORD_RESET_BASE_URL to the public HTTPS reset page}
      MANAGEMENT_EXPOSED_ENDPOINTS: ${MANAGEMENT_EXPOSED_ENDPOINTS:-health,info}
    volumes:
      - uploads:/app/uploads
    networks:
      - application-network
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APP_RELEASE: ${APP_RELEASE:-}
        VITE_GIT_SHA: ${VITE_GIT_SHA:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    networks:
      application-network:
        ipv4_address: ${FRONTEND_PROXY_IP:-172.28.0.10}
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/ >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mysql-data:
  uploads:

networks:
  application-network:
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.28.0.0/24}
