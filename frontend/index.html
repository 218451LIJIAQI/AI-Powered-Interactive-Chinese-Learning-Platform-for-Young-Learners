<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Lock the document to the light token palette; we deliberately removed
         dark-mode support so the user agent should not auto-invert anything. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fbfbfb" />
    <!-- iOS Safari otherwise auto-detects strings that look like phone numbers
         and turns them into tap-to-call links — unwanted for a learning app. -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Brand & SEO -->
    <title>AI Chinese Learning — A playful Mandarin platform for young learners</title>
    <meta
      name="description"
      content="A bright, child-friendly AI-powered Mandarin learning platform built for ages 7–12 — with AI tutoring, interactive practice, story activities, and gamified progress tracking."
    />

    <!-- Favicon + iOS home-screen icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI Chinese Learning" />
    <meta
      property="og:description"
      content="Learn Mandarin with AI tutoring, interactive practice, and gamified progress tracking."
    />
    <meta property="og:locale" content="en" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:locale:alternate" content="ms_MY" />

    <!-- Premium typography. Inter for product UI (used by Linear, Vercel,
         GitHub, Figma), Noto Sans SC for Simplified Chinese glyphs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px; max-width: 480px; margin: 0 auto;">
        This learning platform requires JavaScript. Please enable JavaScript in your browser to continue.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
