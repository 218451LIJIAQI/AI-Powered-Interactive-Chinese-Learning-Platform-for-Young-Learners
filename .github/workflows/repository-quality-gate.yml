name: Repository Quality Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hosted-safe CI only.
# Deep browser QA and `backend/scripts/validate-flyway-mysql.ps1` remain explicit
# release prechecks in docs/RELEASE_PRECHECK_RUNBOOK.md until a hosted-runner
# path is separately validated end-to-end.

jobs:
  frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Toolchain version alignment
        run: node scripts/check-toolchain-versions.mjs
        working-directory: ${{ github.workspace }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend format check
        run: npm run format:check

      - name: Frontend unit tests and coverage gate
        run: npm run test:unit:coverage

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E smoke test
        run: npm run test:e2e

  backend:
    name: Backend Test And Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Backend tests
        run: bash ./mvnw -B test

      - name: Backend static analysis
        run: bash ./mvnw -B spotbugs:check

      - name: Backend coverage gate
        run: bash ./mvnw -B verify

      - name: Export OpenAPI contract
        run: bash ./mvnw -B -DskipTests -Djacoco.skip=true -DskipOpenApiContract=false verify

      - name: Backend package
        run: bash ./mvnw -B -DskipTests package

  dependency-and-image-scan:
    name: Dependency And Container Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          env_file="${RUNNER_TEMP}/quality-gate.prod.env"
          trap 'rm -f "${env_file}"' EXIT
          cat > "${env_file}" <<'EOF'
          DB_ROOT_PASSWORD=quality-gate-root-password
          DB_PASSWORD=quality-gate-application-password
          JWT_SECRET=quality-gate-jwt-secret-with-more-than-32-characters
          FRONTEND_BASE_URL=https://learn.example.com
          APP_CORS_ALLOWED_ORIGINS=https://learn.example.com
          AI_API_KEY=quality-gate-ai-key
          STRIPE_API_KEY=quality-gate-stripe-key-placeholder
          STRIPE_WEBHOOK_SECRET=quality-gate-stripe-webhook-placeholder
          PAYMENT_SUCCESS_URL=https://learn.example.com/payment/success
          PAYMENT_CANCEL_URL=https://learn.example.com/payment/cancel
          SMTP_HOST=smtp.example.com
          PASSWORD_RESET_BASE_URL=https://learn.example.com/reset-password
          VITE_API_BASE_URL=/api/v1
          EOF
          docker compose --env-file "${env_file}" -f docker-compose.prod.yml config >/dev/null
          docker compose -f backend/docker-compose.yml config >/dev/null

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.34.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
