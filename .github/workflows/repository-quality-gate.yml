name: Repository Quality Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hosted-safe CI only.
# Deep browser QA and `backend/scripts/validate-flyway-mysql.ps1` remain explicit
# release prechecks in RELEASE_PRECHECK_RUNBOOK.md until a hosted-runner path is
# separately validated end-to-end.

jobs:
  frontend:
    name: Frontend Typecheck And Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend production build
        run: npm run build

  backend:
    name: Backend Test And Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Backend tests
        run: ./mvnw -B test

      - name: Backend package
        run: ./mvnw -B -DskipTests package
