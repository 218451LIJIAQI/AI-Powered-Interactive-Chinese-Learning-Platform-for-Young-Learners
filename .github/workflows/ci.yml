name: CI

# Continuous integration for the AI Chinese Learning Platform.
#
# What this workflow guarantees on every push and pull request:
#   1. The backend (Java 21 + Spring Boot 3.5) compiles cleanly and its
#      full integration + unit test suite passes against the embedded H2
#      profile (no external MySQL or AI provider required).
#   2. The frontend (Vue 3 + Vite + TypeScript) installs from a clean
#      lockfile, type-checks via vue-tsc, builds the production bundle,
#      and runs every Vitest unit test.
#
# The two halves run in parallel so the slower backend test stage never
# blocks frontend feedback. Heavy caches (Maven .m2, npm) are restored
# from a stable key so re-runs typically finish in a few minutes even on
# the GitHub-hosted free runners.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-flight runs for the same branch/PR so a fast-follow push
# does not waste runner minutes on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Java 21, Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        # The repository keeps the backend in its own subdirectory so
        # every Maven invocation needs to be scoped accordingly.
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        # The wrapper is checked in but may lose its execute bit on
        # Windows-authored commits; ensure it is runnable on Linux.
        run: chmod +x mvnw

      - name: Run backend test suite
        env:
          # The application requires a JWT secret at startup. Tests use the
          # H2 profile, but the @ConfigurationProperties validation still
          # demands a non-blank secret of at least 32 bytes.
          JWT_SECRET: ci-only-test-secret-please-rotate-32-bytes
        run: ./mvnw -B -ntp test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend type-check, build & tests (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean, reproducible)
        run: npm ci

      - name: Type-check and build production bundle
        run: npm run build

      - name: Run Vitest unit tests
        run: npm test

      - name: Upload built frontend bundle (for inspection)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
