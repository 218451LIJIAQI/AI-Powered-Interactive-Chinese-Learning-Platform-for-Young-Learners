services:
  mysql:
    image: mysql:8.4
    container_name: ai-chinese-learning-mysql
    restart: unless-stopped
    # Pull credentials from the environment so the developer can override the
    # root password via DB_PASSWORD without editing docker-compose.yml. The
    # `:-root` defaults preserve the existing local-dev experience while
    # giving CI / staging a clean override path. The healthcheck mirrors
    # the same env-var so a custom password keeps the readiness probe green.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-ai_chinese_learning}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
